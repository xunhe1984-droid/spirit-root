<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — 页面未找到 | Spirit Root</title>
  <meta name="robots" content="noindex" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf8f2;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    .wrap { text-align: center; padding: 40px 24px; }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; border: 2px solid #8a6d3b;
      background: #e8f0ec; color: #2f6b4f;
      font-size: 28px; font-weight: 700;
    }
    h1 { font-size: 64px; font-weight: 700; color: #2f6b4f; letter-spacing: 2px; }
    p { margin-top: 12px; color: #888; font-size: 15px; line-height: 1.8; }
    a {
      display: inline-block; margin-top: 28px; padding: 10px 28px;
      background: #2f6b4f; color: #fff; text-decoration: none;
      border-radius: 999px; font-size: 14px; transition: opacity .2s;
    }
    a:hover { opacity: .85; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">灵</div>
    <h1>404</h1>
    <p>页面不存在或已被移除。<br />您访问的内容可能已更新，请返回首页继续浏览。</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
